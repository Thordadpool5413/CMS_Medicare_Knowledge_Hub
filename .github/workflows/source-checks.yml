name: Source checks

on:
  push:
    branches:
      - appdeploy-production-import-2026-09-11
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and model tests
        run: npm test
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Backend typecheck
        run: npm run typecheck:backend
